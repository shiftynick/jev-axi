name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm provenance
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          # no registry-url: setup-node would write a placeholder _authToken to .npmrc,
          # and npm must see no token at all to use the OIDC trusted-publisher flow
      # npm >= 11.5 authenticates to npmjs.com through GitHub's OIDC token when the
      # package has this workflow registered as a trusted publisher; no secret needed.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: npm publish --access public --provenance

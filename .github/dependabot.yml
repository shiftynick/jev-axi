version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5
    ignore:
      # Types track the oldest supported Node (engines), not the latest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # vitest 5 requires Node >= 22.12; hold until CI drops Node 20.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
